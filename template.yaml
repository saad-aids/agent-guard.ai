AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AgentGuard.ai — AI agent cost guardrail service

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        AGENT_RULES_TABLE: !Ref AgentRulesTable
        INTERCEPT_LOGS_TABLE: !Ref InterceptLogsTable
        BEDROCK_MODEL_ID: amazon.nova-micro-v1:0

Resources:

  # ── API Gateway (HTTP API with CORS) ───────────────────────────
  AgentGuardApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - Content-Type
          - X-API-Key
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  # ── Lambda Functions ───────────────────────────────────────────
  AnalyzerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.analyze.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentRulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InterceptLogsTable
        - SSMParameterReadPolicy:
            ParameterName: /agentguard/api-keys/*
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource: arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0
      Events:
        AnalyzeLog:
          Type: HttpApi
          Properties:
            ApiId: !Ref AgentGuardApi
            Path: /v1/analyze-log
            Method: POST

  RulesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.rules.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentRulesTable
        - SSMParameterReadPolicy:
            ParameterName: /agentguard/api-keys/*
      Events:
        Rules:
          Type: HttpApi
          Properties:
            ApiId: !Ref AgentGuardApi
            Path: /v1/rules
            Method: POST

  MetricsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.metrics.lambda_handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref InterceptLogsTable
        - SSMParameterReadPolicy:
            ParameterName: /agentguard/api-keys/*
      Events:
        MetricsDashboard:
          Type: HttpApi
          Properties:
            ApiId: !Ref AgentGuardApi
            Path: /v1/metrics/dashboard
            Method: GET

  InterceptFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: handlers.intercept.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AgentRulesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref InterceptLogsTable
        - SSMParameterReadPolicy:
            ParameterName: /agentguard/api-keys/*
        - Statement:
            Effect: Allow
            Action:
              - bedrock:InvokeModel
            Resource: arn:aws:bedrock:us-east-1::foundation-model/amazon.nova-micro-v1:0
      Events:
        ProxyIntercept:
          Type: HttpApi
          Properties:
            ApiId: !Ref AgentGuardApi
            Path: /v1/proxy/intercept
            Method: POST

  # ── DynamoDB Tables ────────────────────────────────────────────
  AgentRulesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: AgentRules
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: developer_id
          AttributeType: S
      KeySchema:
        - AttributeName: developer_id
          KeyType: HASH

  InterceptLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: InterceptLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: developer_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: developer_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${AgentGuardApi}.execute-api.us-east-1.amazonaws.com"
  AnalyzerFunctionArn:
    Description: Analyzer Lambda function ARN
    Value: !GetAtt AnalyzerFunction.Arn
  RulesFunctionArn:
    Description: Rules Lambda function ARN
    Value: !GetAtt RulesFunction.Arn
  MetricsFunctionArn:
    Description: Metrics Lambda function ARN
    Value: !GetAtt MetricsFunction.Arn
  InterceptFunctionArn:
    Description: Intercept Lambda function ARN
    Value: !GetAtt InterceptFunction.Arn
  AgentRulesTableName:
    Description: AgentRules DynamoDB table name
    Value: !Ref AgentRulesTable
  InterceptLogsTableName:
    Description: InterceptLogs DynamoDB table name
    Value: !Ref InterceptLogsTable
